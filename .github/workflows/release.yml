name: Release

# Swift packages are published by git tag: SwiftPM resolves versions from
# tags, and the Swift Package Index picks new tags up on its own. There is no
# registry upload and no token. Push a tag such as 0.1.0 (matching
# DocuconfSDK.version) and this workflow tests that exact commit and creates
# the GitHub release.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container: swift:6.3-noble
    steps:
      - uses: actions/checkout@v4
      - name: Pick the docuconf-go ref
        id: dcref
        run: echo "ref=$(tr -d '[:space:]' < .github/docuconf-go.ref)" >> "$GITHUB_OUTPUT"
      - name: Check out docuconf-go
        uses: actions/checkout@v4
        with:
          repository: docuconf/docuconf-go
          ref: ${{ steps.dcref.outputs.ref }}
          path: docuconf-go
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: go install cuelang.org/go/cmd/cue@v0.17.1 && echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Check the tag matches DocuconfSDK.version
        run: |
          version=$(sed -n 's/.*static let version = "\(.*\)".*/\1/p' Sources/DocuconfCore/Contract.swift)
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match DocuconfSDK.version $version" >&2
            exit 1
          fi

      - run: swift test --traits TLS
        env:
          DOCUCONF_SPEC_CUE: ${{ github.workspace }}/docuconf-go/spec/cue
          DOCUCONF_REQUIRE_VET: "1"
          # The shared conformance suite (SPEC §12), run through contract-first mode.
          DOCUCONF_CONFORMANCE: ${{ github.workspace }}/docuconf-go/conformance/cases.json
          DOCUCONF_REQUIRE_CONFORMANCE: "1"

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "The GitHub release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          flags=()
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          # The notes lead with the Swift Package Index page and the SwiftPM line; the
          # generated changelog follows.
          notes=$(cat <<NOTES
          Swift Package Index: https://swiftpackageindex.com/docuconf/docuconf-swift (documentation and compatibility)

          \`\`\`swift
          .package(url: "https://github.com/docuconf/docuconf-swift.git", exact: "$GITHUB_REF_NAME")
          \`\`\`
          NOTES
          )
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --notes "$notes" "${flags[@]}"
